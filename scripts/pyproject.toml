# The Python environment for the fixture and check scripts in this
# directory: the references sl3dpp's tests are held to come from pyslfp and
# planetmodel as published on PyPI, not from a checkout of either. Create it
# here and run a script through it:
#
#   cd scripts && poetry install --no-root
#   poetry run python make_love_number_fixtures.py
#
# Each fixture script writes into tests/data unless given --data-dir, which
# is how a regeneration is compared with the committed fixtures before it
# replaces them. See tests/data/README.md.

[tool.poetry]
name = "sl3dpp-fixture-scripts"
version = "0.1.0"
description = "Environment for the sl3dpp fixture and check scripts"
authors = ["sl3dpp"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12"
pyslfp = ">=3.0.0,<4"
planetmodel = {version = ">=1.3.2,<2", extras = ["netcdf", "plot"]}
numpy = ">=2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
